# Publishes the prototypes (prototype/, without src/ and README.md) to GitHub Pages.
# Runs on every push to main, or by hand from the Actions tab.
# Repository settings > Pages > Source must be "GitHub Actions".
name: Deploy prototypes to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build and test the student app
        working-directory: prototype/src
        run: |
          node build.js
          node test.js

      - name: Assemble the site
        run: |
          mkdir -p _site
          rsync -a --exclude 'src/' --exclude 'README.md' prototype/ _site/
          find _site -type f | sort

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
